name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: openhome-gpt-live-ability
          path: |
            dist/openhome-gpt-live-ability.zip
            dist/openhome-gpt-live-ability.zip.sha256
            dist/openhome-gpt-live-release.zip
